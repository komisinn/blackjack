<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- G10 プロフィール編集 -->
<head th:replace="~{fragments/header :: head('プロフィール編集')}"></head>
<body>
<header th:replace="~{fragments/header :: header('profile')}"></header>
<main>
    <div class="panel" style="max-width:450px">
        <h2>プロフィール編集</h2>
        <p class="lead">パスワードを変えない場合は空欄のままにしてください。</p>

        <form th:action="@{/profile}" method="post">
            <!-- ① メールアドレス（変更不可：readonly で表示だけ。name を付けないので送信もされない） -->
            <div class="field">
                <label for="email">メールアドレス（変更不可）</label>
                <input id="email" type="email" th:value="${email}" readonly>
            </div>
            <!-- ② ユーザー名 -->
            <div class="field">
                <label for="userName">ユーザー名</label>
                <input id="userName" name="userName" type="text" maxlength="50" th:value="${userName}" required>
            </div>
            <!-- ③ 新しいパスワード -->
            <div class="field">
                <label for="newPassword">新しいパスワード</label>
                <input id="newPassword" name="newPassword" type="password" maxlength="64" placeholder="8文字以上">
            </div>
            <!-- ④ 新しいパスワード（確認） -->
            <div class="field">
                <label for="newPasswordConfirm">新しいパスワード（確認）</label>
                <input id="newPasswordConfirm" name="newPasswordConfirm" type="password" maxlength="64" placeholder="もう一度入力">
            </div>

            <!-- ⑤ メッセージ（保存完了 または 入力エラー） -->
            <div class="msg ok" th:if="${message}" th:text="${message}">変更を保存しました</div>
            <div class="msg err" th:if="${error}" th:text="${error}"></div>

            <div class="row">
                <!-- ⑥ 変更を保存 -->
                <button class="btn gold" type="submit">変更を保存</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
