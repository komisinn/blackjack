<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- G4 ホーム -->
<head th:replace="~{fragments/header :: head('ホーム')}"></head>
<body>
<header th:replace="~{fragments/header :: header('home')}"></header>
<main>
    <div class="stack">

        <div class="panel hero">
            <div class="hi">ようこそ</div>
            <!-- ① ユーザー名 -->
            <div class="name"><span th:text="${user.userName}">demo</span> さん</div>
            <!-- ② 所持チップ -->
            <div class="chipbig"><span th:replace="~{fragments/header :: coin(${user.chips})}"></span></div>
            <!-- ③ 連勝数（1連勝以上の時だけ） -->
            <div class="streak" th:if="${user.streak ge 1}"><span th:text="${user.streak}">2</span>連勝中</div>
            <div style="height:10px" th:unless="${user.streak ge 1}"></div>

            <!-- ④ ゲームを始める（チップが0の時は押せない） -->
            <a class="btn gold" style="padding:10px 34px" th:href="@{/game/bet}" th:if="${user.chips gt 0}">ゲームを始める</a>
            <button class="btn gold" style="padding:10px 34px" disabled th:if="${user.chips == 0}">ゲームを始める</button>
            <br>

            <!-- ⑧ チップリセット（所持チップが0の時だけ表示） -->
            <div class="resetbox" th:if="${user.chips == 0}">
                チップがなくなりました
                <form class="inline" th:action="@{/chips/reset}" method="post">
                    <button class="btn gold mini" type="submit">初期額（1,000）に戻す</button>
                </form>
                <span class="note">※所持チップが0のときのみ表示</span>
            </div>
            <div class="msg err" th:if="${error}" th:text="${error}"></div>
        </div>

        <!-- ⑤ これまでの成績 -->
        <div class="panel">
            <h2>これまでの成績</h2>
            <div class="stats3">
                <div><div class="v num" th:text="${stats.totalGames}">24</div><div class="k">プレイ数</div></div>
                <div><div class="v num" th:text="${stats.winRate} + '%'">54%</div><div class="k">勝率</div></div>
                <div><div class="v num" th:text="${stats.netLabel}">+450</div><div class="k">チップ収支</div></div>
            </div>
        </div>

    </div>
</main>
</body>
</html>
