<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- G13 プレイ履歴 -->
<head th:replace="~{fragments/header :: head('プレイ履歴')}"></head>
<body>
<header th:replace="~{fragments/header :: header('history')}"></header>
<main>
    <div class="stack">

        <div class="panel">
            <h2>プレイ履歴</h2>
            <p class="lead">全ユーザーのプレイ履歴です。</p>

            <!-- ① 絞り込み条件（ユーザー名・期間） ／ ② 検索 -->
            <form class="row" th:action="@{/admin/history}" method="get">
                <input class="search" style="max-width:190px" name="name" th:value="${name}" maxlength="50" placeholder="ユーザー名">
                <input class="search" style="max-width:220px" name="period" th:value="${period}" maxlength="50" placeholder="期間　2026/11/01〜11/30">
                <button class="btn gold" style="padding:6px 16px" type="submit">検索</button>
            </form>

            <div class="msg err" th:if="${error}" th:text="${error}" style="margin-top:8px"></div>

            <!-- ③ 履歴一覧（新しい順） -->
            <div class="scroll" style="margin-top:10px">
                <table class="tbl">
                    <thead>
                    <tr><th>日時</th><th>ユーザー</th><th>賭け金</th><th>結果</th><th>収支</th><th>精算後チップ</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="g : ${games}" th:with="total=${g.net + g.bonus}">
                        <td class="num" th:text="${#temporals.format(g.playedAt, 'MM/dd HH:mm')}">11/20 14:32</td>
                        <td th:text="${g.user.userName}">kenta</td>
                        <td class="num" th:text="${g.bet}">100</td>
                        <td><span class="tag" th:classappend="${resultTags[g.result]}" th:text="${resultTags[g.result]}">WIN</span></td>
                        <td class="num" th:text="${(total gt 0 ? '+' : '') + #numbers.formatInteger(total, 1, 'COMMA')}">+100</td>
                        <td class="num" th:text="${#numbers.formatInteger(g.chipsAfter, 1, 'COMMA')}">3,120</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(games)}"><td colspan="6">該当する履歴がありません</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- ④ ページ切替（20件ずつ）。検索条件を付けたまま前後のページへ -->
            <div class="pager">
                <a class="btn white" th:if="${page gt 1}"
                   th:href="@{/admin/history(name=${name}, period=${period}, page=${page - 1})}">‹ 前へ</a>
                <button class="btn white" disabled th:unless="${page gt 1}">‹ 前へ</button>
                <span><span th:text="${page}">1</span> / <span th:text="${totalPages}">65</span></span>
                <a class="btn white" th:if="${page lt totalPages}"
                   th:href="@{/admin/history(name=${name}, period=${period}, page=${page + 1})}">次へ ›</a>
                <button class="btn white" disabled th:unless="${page lt totalPages}">次へ ›</button>
            </div>
        </div>

        <!-- 「ホームへ」ボタンは置かない（ヘッダーのメニューで戻れるため） -->

    </div>
</main>
</body>
</html>
