server.address=127.0.0.1
spring.datasource.url=jdbc:mysql://localhost:3306/${BLACKJACK_DB_NAME:blackjack_dev}?connectionTimeZone=UTC
spring.datasource.username=${BLACKJACK_DB_USER:blackjack_dev}
spring.datasource.password=${BLACKJACK_DB_PASSWORD}
# エンティティ（User / Game）に合わせて users・games テーブルを自動で作成・更新する
# ※開発中だけ update にする。本番では validate などに変えるのが安全
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
